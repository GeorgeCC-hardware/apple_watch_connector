name: Sync with upstream

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync main from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: LordixDemon/apple_watch_connector
        run: |
          gh repo sync "$GITHUB_REPOSITORY" --source "$UPSTREAM" --branch main --force
